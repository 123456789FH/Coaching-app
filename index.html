te;left:55px;top:10px;width:126px;height:173px;border:1px solid #ede7ce;border-radius:6px 12px 12px 6px;background:linear-gradient(100deg,#ebdfbd,#fff6db 16%,#f7ebca 95%);box-shadow:2px 2px #cfbb92,4px 4px #efdfbc,7px 8px #689087,12px 14px 22px #0c232b77}.notebook:before{content:"";position:absolute;inset:0 12px 0 auto;width:7px;background:#b69451aa}.notebook:after{content:"";position:absolute;inset:20px auto 17px 0;width:9px;background:repeating-linear-gradient(to bottom,#738378 0 3px,transparent 3px 12px)}.booklabel{position:absolute;left:20px;top:48px;color:#32554c;text-align:center;font:700 18px/1.5 var(--f);border-top:1px solid #a0a484;border-bottom:1px solid #a0a484;padding:8px 4px;transform:rotate(.1deg)}.booklabel svg{width:22px;height:22px;margin:0 auto 4px}.paper2{position:absolute;left:83px;top:29px;width:122px;height:162px;background:repeating-linear-gradient(0deg,#ebddc0 0 1px,#f7f0da 1px 14px);border-radius:5px;transform:rotate(22deg);box-shadow:3px 7px 10px #122b3166}.pencil{position:absolute;left:21px;top:26px;width:9px;height:139px;transform:rotate(-9deg);border-radius:4px 4px 1px 1px;background:linear-gradient(to right,#bb8b39,#f0c677 38%,#a27b3d 85%);box-shadow:5px 6px 5px #183a3e99}.pencil:after{content:"";position:absolute;bottom:-13px;border-top:14px solid #ceb794;border-left:4.5px solid transparent;border-right:4.5px solid transparent}.pencil:before{content:"";position:absolute;top:12px;left:0;width:9px;height:6px;background:#29423c}.star{position:absolute;color:#debd80;font:26px Georgia}.s1{top:23%;left:75%}.s2{top:72%;left:13%;font-size:18px}

 fieldGrid(field("observation","ملاحظة الكوتش وتدخّله","textarea","ما الملاحظة؟ وكيف جرى استكشافها مع الطرف المستفيد؟"))+
 '<h3>خطوات التنفيذ المتّفق عليها</h3><p class="sub">يمكن إضافة خطوة جديدة أو تخصيص الخطوة المقترحة للنموذج.</p>'+
 active.plan.map((p,i)=>'<div class="action-row"><div class="rowhead"><strong>الخطوة '+ar(i+1)+'</strong>'+ib("حذف الخطوة","rm-plan",i,"trash")+'</div><div class="fields">'+[["what","خطوة التنفيذ"],["how","طريقة التنفيذ"],...(active.model==="org"?[["owner","المسؤول عن التنفيذ"]]:[]),["when","وقت التنفيذ"]].map(([k,l])=>'<label class="field">'+l+'<input data-plan="'+i+'" data-key="'+k+'" value="'+esc(p[k]||"")+'"></label>').join("")+'</div></div>').join("")+
 '<div class="actions" style="margin-top:12px">'+btn("إضافة خطوة","add-plan","","softbtn","plus")+btn("استخدام خطوة مقترحة","suggest-plan","","link","book")+'</div>'}
function endForm(){return '<h2>الخلاصة والمتابعة</h2>'+fieldGrid(field("learning","تعلّمات الطرف المستفيد","textarea","ما الذي أصبح أوضح للمستفيد؟"),field("result","حصيلة الجلسة","textarea","ما الذي تحقّق داخل اللقاء؟"),field("after","مدى قرب الطرف المستفيد من الهدف في النهاية","score","",false))+
 fieldGrid(field("assignment","التكليفات","textarea","ما التطبيق الذي اختاره الطرف المستفيد؟"))+chipGroup("follow","طريقة المتابعة")+field("followNote","تفاصيل إضافية للمتابعة","text")+chipGroup("next","موعد المتابعة النسبي")+fieldGrid(field("nextDate","تاريخ محدّد إن وُجد","date","",false),field("nextNote","موعد آخر أو شرط للمتابعة","text","",false))}
function editPage(){
 const m=models[active.model];return pagehead("توثيق جلسة "+m.name,active.fields.title||m.desc,btn("معاينة التقرير","view",active.id,"softbtn","eye"))+
 '<div class="layout"><aside class="sidebar panel"><h3>مراحل التوثيق</h3><div class="steps">'+steps.map((t,i)=>'<button class="step '+(step===i?"active":"")+'" data-act="step" data-v="'+i+'" '+(step===i?'aria-current="step"':'')+'><span>'+ar(i+1)+'</span>'+t+'</button>').join("")+'</div><div class="rule"></div><p class="help">يمكن التنقّل بين المراحل والعودة إلى المسودة في أي وقت.</p></aside><section class="formpanel panel"><div id="formerr" role="alert"></div>'+[introForm,modelForm,planForm,endForm][step]()+'<div class="step-actions"><div class="actions">'+(step<3?btn("التالي","step",step+1,"btn","arrow"):btn("إكمال الجلسة ومعاينة التقرير","complete","","btn","check"))+(step>0?btn("السابق","step",step-1,"softbtn","back"):"")+'</div><span id="saved" class="notif">'+(storageFail?"تعذّر الحفظ الدائم":"محفوظة على جهازك")+'</span></div></section></div>'
}
function reportHtml(rep){return '<article class="report"><div class="report-title"><p>'+esc(rep.subtitle)+'</p><h2>'+esc(rep.title)+'</h2></div>'+rep.groups.map(g=>'<section><h3>'+esc(g.name)+'</h3><table>'+(g.plan?'<thead><tr>'+g.headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+g.plan.map(row=>'<tr>'+row.map(v=>'<td dir="auto">'+esc(v)+'</td>').join("")+'</tr>').join("")+'</tbody>':'<tbody>'+g.items.map(([k,v])=>'<tr><th scope="row">'+esc(k)+'</th><td dir="auto">'+esc(v)+'</td></tr>').join("")+'</tbody>')+'</table></section>').join("")+'<footer>'+AUTHOR+'</footer></article>'}
function viewPage(){
 const example=active.id==="example",rep=reportData(active);return pagehead(example?"معاينة نموذج تدريبي":"معاينة التقرير",example?"مثال من النموذج المرفق، مستقلّ عن سجلّ جلساتك.":(active.status==="done"?"جلسة مكتملة":"مسودة قابلة للاستكمال"),btn("تنزيل Word","word","","btn","file")+btn("تنزيل PDF A4","pdf","","btn","download")+btn("طباعة","print","","softbtn","print")+(example?btn("بدء جلسة مماثلة","new","grow","softbtn","plus"):btn("تعديل","edit",active.id,"softbtn","pen")+ib("حذف الجلسة","delete",active.id,"trash")))+reportHtml(rep)
}
function render(scroll=false){
 const hash=decodeHash().split("/");route=hash[0]||"home";
 if(["edit","view"].includes(route)){
  const id=hash[1];active=id==="example"&&route==="view"?sample():allSessions().find(s=>s.id===id);
  if(!active){go("sessions");return}step=Math.max(0,Math.min(3,parseInt(hash[2]??active.step,10)||0))
 }else active=null;
 if(!["home","sessions","progress","edit","view"].includes(route))route="home";
 for(const n of document.querySelectorAll("nav button")){const on=n.dataset.v===route||(route==="edit"||route==="view")&&n.dataset.v==="sessions";n.classList.toggle("active",on);if(on)n.setAttribute("aria-current","page");else n.removeAttribute("aria-current")}
 document.body.classList.toggle("view-mode",route==="view");
 app.innerHTML=({home,sessions:listPage,progress:progressPage,edit:editPage,view:viewPage}[route])();
 if(scroll){window.scrollTo(0,0);app.focus({preventScroll:true})}
}
function decodeHash(){try{return decodeURIComponent(location.hash.slice(1))}catch{return ""}}
function dialog(title,html){dc.innerHTML='<div class="dialoghead"><h2>'+esc(title)+'</h2>'+ib("إغلاق","close","","close")+'</div>'+html;if(!dlg.open)dlg.showModal()}
dlg.addEventListener("click",e=>{if(e.target===dlg){const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()}});
function setStep(n){if(!active)return;step=Math.max(0,Math.min(3,Number(n)||0));active.step=step;save(active);go("edit/"+active.id+"/"+step)}
function finish(){const f=active.fields;let error=null;
 if(!f.title?.trim()||!f.client?.trim())error=[0,"يلزم إدخال موضوع الجلسة واسم أو رمز للطرف المستفيد أو الفريق.",!f.title?.trim()?"title":"client"];
 else if(!models[active.model].stages.some(([k])=>f[k]?.trim()))error=[1,"يلزم توثيق مرحلة واحدة على الأقل من مسار النموذج.",models[active.model].stages[0][0]];
 else if(!f.result?.trim()&&!f.learning?.trim())error=[3,"يلزم تدوين حصيلة الجلسة أو ما تعلّمه الطرف المستفيد.","result"];
 if(error){active.step=step=error[0];save(active);history.replaceState(null,"","#edit/"+active.id+"/"+step);render();const a=document.getElementById("formerr");a.className="err";a.textContent=error[1];app.querySelector('[data-field="'+error[2]+'"]')?.focus();return}
 active.status="done";active.updated=Date.now();save(active);go("view/"+active.id);toast("اكتملت الجلسة وأُضيفت إلى تقدّم الاعتماد.")
}
let exporting=false;
document.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==="language"){const lang=LANG==="ar"?"en":"ar";try{localStorage.setItem("midad.language",lang)}catch{};const u=new URL(location.href);u.searchParams.set("lang",lang);location.assign(u.href);return}
 if(a==="theme"){applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");return}
 if(a==="close"){dlg.close();return}
 if(a==="nav"){go(v);return}
 if(a==="pick"){dialog("اختيار نموذج الجلسة",'<div class="modelpick">'+modelKeys.map(k=>{const m=models[k];return '<button class="pick" data-act="new" data-v="'+k+'">'+modelIcon(m)+'<strong>'+m.name+'</strong><small>'+m.desc+'</small></button>'}).join("")+'</div>');return}
 if(a==="new"&&Object.hasOwn(models,v)){if(dlg.open)dlg.close();const s=blank(v);save(s);go("edit/"+s.id+"/0");return}
 if(a==="sample"){go("view/example");return}
 if(a==="view"||a==="edit"){go(a+"/"+v);return}
 if(a==="backup"){dialog("إدارة بيانات الجلسات",notice()+'<p class="sub" style="margin-top:10px">يمكن تنزيل نسخة احتياطية قبل تغيير الجهاز أو مسح بيانات المتصفح. تتضمن النسخة تفاصيل الجلسات.</p><div class="backup-actions">'+btn("تنزيل نسخة احتياطية","backup-save","","btn","download")+'<label class="softbtn filebtn">'+icon("folder")+'استعادة نسخة من ملف<input id="restore" type="file" accept=".json,application/json" aria-label="اختيار نسخة احتياطية"></label></div>');return}
 if(a==="backup-save"){downloadBlob(new Blob([JSON.stringify({format:"midad-coaching",version:1,sessions:allSessions().map(canonical)},null,2)],{type:"application/json"}),"midad-backup-"+localDate()+".json");toast("تم تجهيز النسخة الاحتياطية.");return}
 if(!active)return;
 if(a==="step"){setStep(v);return}
 if(a==="chip"){const selected=active.picks[v]||[],label=choices[v][Number(b.dataset.i)];active.picks[v]=selected.includes(label)?selected.filter(x=>x!==label):(v==="next"?[label]:[...selected,label]);touch();
 for(const el of app.querySelectorAll('.chip[data-v="'+v+'"]')){const t=choices[v][Number(el.dataset.i)],on=active.picks[v].includes(t);el.classList.toggle("sel",on);el.setAttribute("aria-pressed",String(on));el.innerHTML=icon(on?"check":"plus")+esc(t)}return}
 if(a==="add-plan"||a==="suggest-plan"||a==="rm-plan"){if(a==="rm-plan"){active.plan.splice(Number(v),1)}else if(a==="add-plan")active.plan.push({what:"",how:"",when:"",owner:""});else {const [what,how,when]=suggestedPlans[active.model][0];active.plan.push({what,how,when,owner:""})}touch();const pos=window.scrollY;render();window.scrollTo(0,pos);if(a!=="rm-plan")app.querySelector('[data-plan="'+(active.plan.length-1)+'"]')?.focus();return}
 if(a==="complete"){finish();return}
 if(a==="delete"){dialog("حذف الجلسة؟",'<p>ستُحذف الجلسة «'+esc(active.fields.title||models[active.model].name)+'» من سجل هذا الجهاز.</p><div class="dialog-actions">'+btn("حذف الجلسة","confirm-delete",active.id,"btn danger","trash")+btn("إلغاء","close","","softbtn")+'</div>');return}
 if(a==="confirm-delete"&&v===active.id){try{localStorage.removeItem(PREFIX+v)}catch{toast("تعذّر حذف الجلسة من المتصفح.");return}volatile.delete(v);removed.add(v);dlg.close();go("sessions");toast("حُذفت الجلسة.");return}
 if(a==="print"){window.print();return}
 if(a==="word"||a==="pdf"){if(exporting)return;exporting=true;const before=b.innerHTML;b.disabled=true;b.textContent="جارٍ تجهيز الملف…";try{const rep=reportData(active),file=a==="word"?makeWord(rep):await makePDF(rep);downloadBlob(file,safeFile(rep.title)+(a==="word"?".docx":".pdf"));toast("تم تجهيز الملف للتنزيل.")}catch{toast("تعذّر إنشاء الملف. تتوفر الطباعة من معاينة التقرير.")}finally{exporting=false;b.disabled=false;b.innerHTML=before}return}
});
document.addEventListener("input",e=>{
 const t=e.target;if(t.id==="search"){search=t.value;document.getElementById("results").innerHTML=listResults();return}

document.addEventListener("change",async e=>{
 const t=e.target;if(t.id==="modelFilter"||t.id==="statusFilter"){if(t.id==="modelFilter")modelFilter=t.value;else statusFilter=t.value;document.getElementById("results").innerHTML=listResults()}
